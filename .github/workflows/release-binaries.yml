# When a release is published, a native (GraalVM) Windows build of fsh-ide (the fsh script editor
# and debugger) is made and attached to that release as a separate download:
#
#   fsh-ide-VERSION-windows-x86_64.zip      (with a .sha256 beside it)
#
# Run by hand (Actions > release-binaries > Run workflow) it builds the same and keeps the zip as a
# workflow artifact so it can be tested before anything is published; with a tag it also attaches
# it to that release.
#
# Windows only for now: the Swing/AWT reachability metadata in
# resources/META-INF/native-image was recorded with the tracing agent on Windows. Linux and macOS
# need their own recording (java -agentlib:native-image-agent=config-merge-dir=... on that platform,
# exercising the app) before they can be added to the matrix.
#
# Needs one secret, PACKAGES_TOKEN: a token that can read the Parley and fsh packages
# (https://maven.pkg.github.com/tony-bringardner/tony-bringardner); the workflow's own token cannot
# read another repository's packages. Without it the build uses the workflow token, which works
# only if those packages grant this repository access.

name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the binary to (empty: only keep it as an artifact)'
        required: false
        default: ''

permissions:
  contents: write   # attach the file to the release
  packages: read    # the Parley dependencies

jobs:
  binary:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows, arch: x86_64 }

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # The same GraalVM the metadata was recorded with (native-image included)
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # Maven finds the Parley packages through the user's settings, as on the developer's machine
      - name: Maven settings
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
          PACKAGES_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<XML
          <settings>
            <activeProfiles><activeProfile>github</activeProfile></activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository><id>central</id><url>https://repo1.maven.org/maven2</url></repository>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/tony-bringardner/tony-bringardner</url>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server><id>github</id><username>${PACKAGES_USER}</username><password>${PACKAGES_TOKEN}</password></server>
            </servers>
          </settings>
          XML

      # MSVC for the native linker
      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the native image
        shell: cmd
        run: mvn -B -Pnative -DskipTests clean package

      # A window app: start it, and it must still be running (not crashed) after a while
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\target\fsh-ide.exe -WorkingDirectory .\target -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "fsh-ide.exe exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output "fsh-ide.exe stayed up"

      # The exe, the JDK's AWT libraries it loads (*.dll) and lib\fontconfig.bfc, kept together
      - name: Package
        shell: pwsh
        run: |
          $v = if ($env:TAG) { $env:TAG.TrimStart('v') } else { $env:GITHUB_SHA.Substring(0, 7) }
          $name = "fsh-ide-$v-windows-x86_64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force "$stage\lib" | Out-Null
          Copy-Item target\fsh-ide.exe, target\*.dll $stage
          Copy-Item target\lib\fontconfig.bfc "$stage\lib"
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
          "Run fsh-ide.exe. Keep the files in this folder together (the .dll files and lib\fontconfig.bfc are loaded by it)." | Set-Content "$stage\README.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip"
          $h = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Set-Content "dist\$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fsh-ide-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
